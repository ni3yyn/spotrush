
name: Build SpotRush Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotrush-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Get the project
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java required by the Android Gradle project
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Exact Godot version matching the committed Android template
      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      # 5. Validate project and template
      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          godot --version
          java -version

          echo "Checking Android template version..."
          grep -qx "4.7.2.stable" android/.build_version

          echo "Checking Gradle template..."
          test -f android/build/build.gradle
          test -f android/build/gradlew
          test -f android/build/gradle/wrapper/gradle-wrapper.properties
          test -f android/build/src/main/AndroidManifest.xml

          echo "Checking notification plugin..."
          test -s addons/NotificationSchedulerPlugin/bin/debug/NotificationSchedulerPlugin-4.1-debug.aar
          test -s addons/NotificationSchedulerPlugin/bin/release/NotificationSchedulerPlugin-4.1-release.aar

          echo "Checking Android export preset..."
          test -f export_presets.cfg
          grep -Fq 'name="Android"' export_presets.cfg
          grep -Fq 'gradle_build/use_gradle_build=true' export_presets.cfg

          echo "All required project files are present."

      # 6. Install SDK versions matching android/build/config.gradle
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses

          sdkmanager --install \
            "platform-tools" \
            "cmdline-tools;latest" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865"

      # 7. Configure Android paths for Godot
      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      # 8. Add notification resources required by the plugin
      - name: Prepare notification resources
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/build/res

          cp -R android_extras/res/. android/build/res/

          chmod +x android/build/gradlew

          test -f android/build/res/drawable-mdpi/ic_notification.png

      # 9. Import project resources
      - name: Import Godot project
        run: |
          godot --headless --editor --path . --import --quit

      # 10. Export APK using the Android preset
      - name: Export Debug APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          godot --headless --path . \
            --export-debug "Android" \
            build/SpotRush-debug.apk

      # 11. Validate output
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          test -s build/SpotRush-debug.apk

          echo "APK generated successfully:"
          ls -lh build/SpotRush-debug.apk

      # 12. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotRush-Android-APK
          path: build/SpotRush-debug.apk
          if-no-files-found: error
          retention-days: 14
