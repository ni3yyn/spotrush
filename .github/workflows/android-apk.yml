
name: Build SpotRush Android AAB

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotrush-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Install EOSG 2.3.1 Android addon package
        shell: bash
        run: |
          set -euo pipefail

          addon="addons/epic-online-services-godot"
          archive="/tmp/epic-online-services-godot-android-2.3.1.zip"
          url="https://github.com/3ddelano/epic-online-services-godot/releases/download/2.3.1/epic-online-services-godot-android-56238973e2cd7ac9ac99ca14f88934465f0a8997.zip"
          expected_sha256="c29489008369a6f695d261f2e378c79e67fbb9bedb45cda102c6949afe58f851"

          # Keep the large platform binaries out of the SpotRush source repo.
          # Install the official 2.3.1 Android/shared package on the CI runner;
          # any local Windows binaries already in the checkout are preserved.
          if [ ! -s "$addon/bin/android/eossdk-StaticSTDC-release.aar" ] || \
             [ ! -s "$addon/bin/android/libeosg.android.template_release.arm64.so" ] || \
             ! grep -Eq '^[[:space:]]*version[[:space:]]*=[[:space:]]*"2\.3\.1"[[:space:]]*$' "$addon/plugin.cfg" 2>/dev/null; then
            echo "Downloading EOSG 2.3.1 Android package..."
            curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$archive"
            echo "$expected_sha256  $archive" | sha256sum --check -

            mkdir -p /tmp/eosg-android-package "$addon"
            unzip -q "$archive" \
              'epic-online-services-godot/addons/epic-online-services-godot/*' \
              -d /tmp/eosg-android-package
            source_addon="/tmp/eosg-android-package/epic-online-services-godot/addons/epic-online-services-godot"
            test -s "$source_addon/plugin.cfg"
            test -s "$source_addon/eos.gd"
            cp -a "$source_addon/." "$addon/"
          else
            echo "EOSG 2.3.1 Android package already present in checkout."
          fi

          grep -Eq '^[[:space:]]*version[[:space:]]*=[[:space:]]*"2\.3\.1"[[:space:]]*$' "$addon/plugin.cfg"
          test -s "$addon/eosg.gdextension"
          test -s "$addon/bin/android/eossdk-StaticSTDC-release.aar"
          test -s "$addon/bin/android/libeosg.android.template_release.arm64.so"
          test -s "$addon/bin/android/libeosg.android.template_debug.dev.arm64.so"
          echo "EOSG 2.3.1 Android GDExtension binaries and SDK AAR are ready."

      - name: Install EOSG 2.3.1 Linux host library for the Ubuntu editor
        shell: bash
        run: |
          set -euo pipefail

          addon="addons/epic-online-services-godot"
          test -s "$addon/eosg.gdextension" || { echo "::error::EOSG addon source is missing after the Android package install."; exit 1; }
          test -s "$addon/bin/android/eossdk-StaticSTDC-release.aar" || { echo "::error::EOS Android SDK AAR is missing after the Android package install."; exit 1; }

          archive="/tmp/epic-online-services-godot-linux-2.3.1.zip"
          url="https://github.com/3ddelano/epic-online-services-godot/releases/download/2.3.1/epic-online-services-godot-linux-56238973e2cd7ac9ac99ca14f88934465f0a8997.zip"
          expected_sha256="76f7afcd01247abbba140d0f6f9d8d4e3524a20e84e08af0acd124238d2575d4"

          echo "Downloading only EOSG's Linux host binaries for the Ubuntu CI runner..."
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$archive"
          echo "$expected_sha256  $archive" | sha256sum --check -

          mkdir -p /tmp/eosg-linux-bin
          unzip -q "$archive" 'epic-online-services-godot/addons/epic-online-services-godot/bin/linux/*' -d /tmp/eosg-linux-bin
          source_bin="/tmp/eosg-linux-bin/epic-online-services-godot/addons/epic-online-services-godot/bin/linux"
          mkdir -p "$addon/bin/linux"
          cp -a "$source_bin/." "$addon/bin/linux/"

          test -s "$addon/bin/linux/libeosg.linux.template_release.x86_64.so"
          test -s "$addon/bin/linux/libEOSSDK-Linux-Shipping.so"
          echo "EOSG 2.3.1 Linux editor libraries installed and checksum-verified."

      - name: Prepare local EOS credentials from GitHub Actions secret
        shell: bash
        env:
          EOS_CLIENT_SECRET: ${{ secrets.EOS_CLIENT_SECRET }}
          EOS_ENCRYPTION_KEY: ${{ secrets.EOS_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${EOS_CLIENT_SECRET:-}" ]; then
            echo "::error::Add EOS_CLIENT_SECRET under GitHub repository Settings → Secrets and variables → Actions. Do not commit EOSLocalConfig.gd."
            exit 1
          fi
          if ! [[ "${EOS_ENCRYPTION_KEY:-}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Add EOS_ENCRYPTION_KEY (64 hexadecimal characters) under GitHub repository Settings → Secrets and variables → Actions."
            exit 1
          fi
          python3 tools/generate_eos_local_config.py
          python3 tools/patch_eosg_autoload_scope.py
          python3 -m unittest tools.test_verify_eos_install tools.test_install_deeplink_plugin
          python3 tools/verify_eos_install.py --platform android --require-local-config

      - name: Install Godot 4.7 Notification Scheduler 6.0
        shell: bash
        run: |
          set -euo pipefail

          archive="/tmp/NotificationSchedulerPlugin-Android-v6.0.zip"
          url="https://github.com/godot-mobile-plugins/godot-notification-scheduler/releases/download/v6.0/NotificationSchedulerPlugin-Android-v6.0.zip"
          expected_sha256="806c85eafe8f4c8aa4ee37e0ed1ab551e85db8755f8aeb1c6302092f809725a3"

          echo "Downloading the Godot 4.7-compatible Android notification plugin..."
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$archive"
          echo "$expected_sha256  $archive" | sha256sum --check -

          # Remove the old 4.1 binaries so they can never be selected accidentally.
          rm -f addons/NotificationSchedulerPlugin/bin/debug/NotificationSchedulerPlugin-4.1-debug.aar
          rm -f addons/NotificationSchedulerPlugin/bin/release/NotificationSchedulerPlugin-4.1-release.aar
          mkdir -p addons/NotificationSchedulerPlugin/bin/debug
          mkdir -p addons/NotificationSchedulerPlugin/bin/release

          unzip -p "$archive" \
            "res/addons/NotificationSchedulerPlugin/bin/debug/NotificationSchedulerPlugin-debug.aar" \
            > addons/NotificationSchedulerPlugin/bin/debug/NotificationSchedulerPlugin-debug.aar

          unzip -p "$archive" \
            "res/addons/NotificationSchedulerPlugin/bin/release/NotificationSchedulerPlugin-release.aar" \
            > addons/NotificationSchedulerPlugin/bin/release/NotificationSchedulerPlugin-release.aar

          test -s addons/NotificationSchedulerPlugin/bin/debug/NotificationSchedulerPlugin-debug.aar
          test -s addons/NotificationSchedulerPlugin/bin/release/NotificationSchedulerPlugin-release.aar

          # Verify the downloaded native binaries are the v6 package namespace,
          # not the stale org.godotengine.plugin.android.notification namespace.
          mkdir -p /tmp/spotrush-notification-v6
          unzip -p addons/NotificationSchedulerPlugin/bin/debug/NotificationSchedulerPlugin-debug.aar classes.jar \
            > /tmp/spotrush-notification-v6/classes.jar
          jar tf /tmp/spotrush-notification-v6/classes.jar > /tmp/spotrush-notification-v6/classes.txt
          grep -Fxq 'org/godotengine/plugin/notification/NotificationSchedulerPlugin.class' /tmp/spotrush-notification-v6/classes.txt
          grep -Fxq 'org/godotengine/plugin/notification/BootReceiver.class' /tmp/spotrush-notification-v6/classes.txt
          grep -Fxq 'org/godotengine/plugin/notification/model/ChannelData.class' /tmp/spotrush-notification-v6/classes.txt

          # Confirm the release AAR is also a v6 binary, not only the debug build.
          unzip -p addons/NotificationSchedulerPlugin/bin/release/NotificationSchedulerPlugin-release.aar classes.jar \
            > /tmp/spotrush-notification-v6/release-classes.jar
          jar tf /tmp/spotrush-notification-v6/release-classes.jar \
            > /tmp/spotrush-notification-v6/release-classes.txt
          grep -Fxq 'org/godotengine/plugin/notification/NotificationSchedulerPlugin.class' /tmp/spotrush-notification-v6/release-classes.txt
          grep -Fxq 'org/godotengine/plugin/notification/BootReceiver.class' /tmp/spotrush-notification-v6/release-classes.txt

          echo "Godot Notification Scheduler 6.0 debug/release AARs installed and checksum-verified."

      - name: Install checksum-pinned Godot Deeplink Plugin 6.0.1
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing the official Godot Deeplink Plugin 6.0.1..."
          python3 tools/install_deeplink_plugin.py

          test -s addons/DeeplinkPlugin/plugin.cfg
          test -s addons/DeeplinkPlugin/bin/debug/DeeplinkPlugin-debug.aar
          test -s addons/DeeplinkPlugin/bin/release/DeeplinkPlugin-release.aar
          echo "Godot Deeplink Plugin 6.0.1 is ready."

      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Checking build environment"
          echo "======================================"

          godot --version
          java -version
          sdkmanager --version

          # The custom Android Gradle template is unpacked from the matching
          # Godot export-template package in the Prepare Gradle Template step.
          # It is intentionally not expected in the source ZIP.
          echo "Checking notification plugin..."
          test -s addons/NotificationSchedulerPlugin/bin/debug/NotificationSchedulerPlugin-debug.aar
          test -s addons/NotificationSchedulerPlugin/bin/release/NotificationSchedulerPlugin-release.aar
          grep -Fq 'version="6.0"' addons/NotificationSchedulerPlugin/plugin.cfg
          test -f addons/NotificationSchedulerPlugin/model/CustomData.gd
          test -f addons/GMPShared/GmpLogger.gd
          grep -Fq 'const PLUGIN_NAME: String = "NotificationSchedulerPlugin"' addons/NotificationSchedulerPlugin/NotificationSchedulerPlugin.gd
          grep -Fq '"%s/bin/debug/%s-debug.aar"' addons/NotificationSchedulerPlugin/NotificationSchedulerPlugin.gd
          grep -Fq '"%s/bin/release/%s-release.aar"' addons/NotificationSchedulerPlugin/NotificationSchedulerPlugin.gd
          grep -Fq 'org.godotengine.plugin.notification.NotificationReceiver' addons/NotificationSchedulerPlugin/NotificationSchedulerPlugin.gd
          grep -Fq 'org.godotengine.plugin.notification.BootReceiver' addons/NotificationSchedulerPlugin/NotificationSchedulerPlugin.gd
          grep -Fq 'DATA_KEY_ID := &"channel_id"' addons/NotificationSchedulerPlugin/model/NotificationChannel.gd
          grep -Fq 'DATA_KEY_NAME := &"channel_name"' addons/NotificationSchedulerPlugin/model/NotificationChannel.gd
          grep -Fq 'DATA_KEY_DESCRIPTION := &"channel_description"' addons/NotificationSchedulerPlugin/model/NotificationChannel.gd
          grep -Fq 'DATA_KEY_IMPORTANCE := &"channel_importance"' addons/NotificationSchedulerPlugin/model/NotificationChannel.gd
          grep -Fq 'func request_test_notification()' scripts/core/DailyReminder.gd
          grep -Fq 'DailyReminder.request_test_notification()' scripts/ui/SettingsScreen.gd
          ! grep -R -Fq 'debug_fire_test_notification' scripts
          ! grep -Fq '4.1-debug.aar' addons/NotificationSchedulerPlugin/NotificationSchedulerPlugin.gd
          ! grep -Fq 'DATA_KEY_ID := &"id"' addons/NotificationSchedulerPlugin/model/NotificationChannel.gd

          echo "Checking Godot Deeplink Plugin..."
          test -s addons/DeeplinkPlugin/plugin.cfg
          grep -Fq 'version="6.0.1"' addons/DeeplinkPlugin/plugin.cfg
          test -s addons/DeeplinkPlugin/Deeplink.gd
          test -s addons/DeeplinkPlugin/DeeplinkPlugin.gd
          test -s addons/DeeplinkPlugin/bin/debug/DeeplinkPlugin-debug.aar
          test -s addons/DeeplinkPlugin/bin/release/DeeplinkPlugin-release.aar
          test -s addons/DeeplinkPlugin/export.cfg
          grep -Fq 'res://addons/DeeplinkPlugin/plugin.cfg' project.godot
          grep -Fq 'scheme = "spotrush"' addons/DeeplinkPlugin/export.cfg
          grep -Fq 'host = "join"' addons/DeeplinkPlugin/export.cfg
          grep -Fq 'path_prefix = ""' addons/DeeplinkPlugin/export.cfg
          grep -Fq 'is_auto_verify = false' addons/DeeplinkPlugin/export.cfg

          echo "Checking Android export preset..."
          test -f export_presets.cfg
          grep -Fq 'name="Android"' export_presets.cfg
          grep -Fq 'gradle_build/use_gradle_build=true' export_presets.cfg
          grep -Fq 'gradle_build/export_format=1' export_presets.cfg
          grep -Fq 'gradle_build/min_sdk="24"' export_presets.cfg
          grep -Fq 'architectures/armeabi-v7a=true' export_presets.cfg
          grep -Fq 'architectures/arm64-v8a=true' export_presets.cfg
          grep -Fq 'architectures/x86=false' export_presets.cfg
          grep -Fq 'architectures/x86_64=false' export_presets.cfg

          echo "All required project files are present."

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Installing Android SDK packages"
          echo "======================================"

          sdkmanager --install \
            "platform-tools" \
            "cmdline-tools;latest" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865"

          echo "Android SDK packages installed."

      - name: Start Android Debug Bridge
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting ADB server..."
          adb start-server
          adb version
          adb devices

          echo "ADB is ready."

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -euo pipefail

          echo "Configuring Godot Android SDK paths..."

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          echo "Godot Android paths configured."

      - name: Exclude development tests from Godot scanning
        shell: bash
        run: |
          set -euo pipefail

          echo "Excluding development test scripts..."

          mkdir -p tests
          touch tests/.gdignore

          echo "Test scripts excluded from Godot project scanning."
          echo "No game tests will be executed."

      - name: Prepare notification resources
        shell: bash
        run: |
          set -euo pipefail

          echo "Preparing Android notification resources..."

          # The v6 exporter reads project assets and copies them into the
          # Android Gradle template during export. Use Android monochrome
          # notification icons with the name expected by v6.
          asset_root="assets/NotificationSchedulerPlugin/android"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$asset_root/drawable-$density"
            cp "android_extras/res/drawable-$density/ic_notification.png" \
              "$asset_root/drawable-$density/ic_default_notification.png"
          done

          test -s "$asset_root/drawable-mdpi/ic_default_notification.png"
          test -s "$asset_root/drawable-xxxhdpi/ic_default_notification.png"

          echo "Notification Scheduler v6 icon resources prepared."

      - name: Export signed Release AAB
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || \
             [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_ALIAS in GitHub Actions secrets before building the signed Play Store AAB."
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/spotrush-upload.keystore"
          trap 'rm -f "$keystore_path"; git checkout -- export_presets.cfg' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          keytool -list -keystore "$keystore_path" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          mkdir -p build

          echo "======================================"
          echo "SPOTRUSH ANDROID BUILD"
          echo "======================================"
          echo "Godot: $(godot --version)"
          echo "Java: $JAVA_HOME"
          echo "Android SDK: $ANDROID_HOME"
          echo "Preset: Android"
          echo "Output: build/SpotRush.aab"
          echo "======================================"

          # Make Gradle print tasks instead of using an animated console.
          export GRADLE_OPTS="${GRADLE_OPTS:-} -Dorg.gradle.console=plain -Dorg.gradle.logging.level=info"

          echo ""
          echo "[1/5] Preparing the Godot 4.7.2 Android Gradle template..."
          # --install-android-build-template is an export modifier, not a
          # standalone installer. Calling it without --export-debug/--export-release
          # starts the project normally and can run the game until CI times out.
          # setup-godot has already installed the matching export-template package.
          godot_full_version="$(godot --version)"
          template_version="$(printf '%s\n' "$godot_full_version" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)\.stable.*/\1.stable/')"
          if [ "$template_version" = "$godot_full_version" ]; then
            echo "::error::Could not derive stable export-template version from: $godot_full_version"
            exit 1
          fi
          template_root="${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates"
          template_zip="$template_root/$template_version/android_source.zip"
          if [ ! -s "$template_zip" ]; then
            echo "::error::Matching Android Gradle template not found: $template_zip"
            echo "Installed template files:"
            find "$template_root" -maxdepth 3 -type f \( -name android_source.zip -o -name version.txt \) -print 2>/dev/null || true
            exit 1
          fi
          rm -rf android/build
          mkdir -p android/build
          unzip -q "$template_zip" -d android/build
          touch android/build/.gdignore
          chmod +x android/build/gradlew
          echo "Installed template archive: $template_zip"

          echo "[2/5] Verifying the generated Godot 4.7.2 Gradle template..."
          test -s android/build/build.gradle || { echo "::error::Godot did not generate android/build/build.gradle."; find android -maxdepth 5 -type f -print 2>/dev/null || true; exit 1; }
          test -s android/build/src/main/java/com/godot/game/GodotApp.java || { echo "::error::Generated GodotApp.java is missing from the Android template."; find android/build -maxdepth 7 -type f -print || true; exit 1; }
          if [ ! -s android/build/src/main/AndroidManifest.xml ] && [ ! -s android/build/AndroidManifest.xml ]; then
            echo "::error::Generated AndroidManifest.xml is missing. Expected src/main/AndroidManifest.xml (Godot 4.7) or the legacy template root.";
            find android/build -maxdepth 7 -type f -iname '*manifest*' -print || true;
            exit 1;
          fi

          echo "[3/5] Deeplink Plugin registers spotrush://join during Android export..."
          test -s addons/DeeplinkPlugin/export.cfg

          echo "[4/5] Integrating EOS Android SDK, Gradle dependencies and native initialization..."
          python3 tools/patch_eos_android_template.py --android-build android/build

          echo "[5/5] Configuring temporary upload signing and building the AAB..."
          echo ""

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("export_presets.cfg")
          contents = path.read_text(encoding="utf-8")
          values = {
              "package/keystore/release": os.environ["RUNNER_TEMP"] + "/spotrush-upload.keystore",
              "package/keystore/user": os.environ["ANDROID_KEY_ALIAS"],
              "package/keystore/password": os.environ["ANDROID_KEYSTORE_PASSWORD"],
          }
          for key, value in values.items():
              old = f'{key}=""'
              new = f"{key}={json.dumps(value)}"
              if contents.count(old) != 1:
                  raise SystemExit(f"Expected exactly one empty {key} setting in export_presets.cfg")
              contents = contents.replace(old, new, 1)
          path.write_text(contents, encoding="utf-8")
          PY

          timeout 30m godot --headless --path . \
            --export-release "Android" \
            build/SpotRush.aab

          echo ""
          echo "======================================"
          echo "Godot export command finished."
          echo "======================================"

      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking generated Android App Bundle..."

          if [ ! -s build/SpotRush.aab ]; then
            echo "::error::AAB was not generated or is empty."
            echo "Build directory contents:"
            find build -maxdepth 2 -type f -ls || true
            exit 1
          fi

          echo "AAB generated successfully:"
          ls -lh build/SpotRush.aab

          echo "Verifying the release signature..."
          jarsigner -verify build/SpotRush.aab

          echo "Verifying the bundle contains only the requested Android ABIs..."
          unzip -Z1 build/SpotRush.aab | grep -Fq 'base/manifest/AndroidManifest.xml'
          actual_abis="$(unzip -Z1 build/SpotRush.aab | sed -nE 's#^base/lib/([^/]+)/.*#\1#p' | sort -u)"
          expected_abis="$(printf 'arm64-v8a\narmeabi-v7a')"
          printf 'Included ABIs:\n%s\n' "$actual_abis"
          if [ "$actual_abis" != "$expected_abis" ]; then
            echo "::error::Expected exactly arm64-v8a and armeabi-v7a, found: ${actual_abis:-none}"
            exit 1
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: SpotRush-Android-AAB
          path: build/SpotRush.aab
          if-no-files-found: error
          retention-days: 14