name: Build SpotRush Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotrush-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          godot --version
          java -version

          grep -qx "4.7.2.stable" android/.build_version

          test -f android/build/build.gradle
          test -f android/build/gradlew
          test -f android/build/gradle/wrapper/gradle-wrapper.properties
          test -f android/build/src/main/AndroidManifest.xml

          test -s addons/NotificationSchedulerPlugin/bin/debug/NotificationSchedulerPlugin-4.1-debug.aar
          test -s addons/NotificationSchedulerPlugin/bin/release/NotificationSchedulerPlugin-4.1-release.aar

          test -f export_presets.cfg
          grep -Fq 'name="Android"' export_presets.cfg

          echo "All required project files are present."

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager was not found in PATH."
            exit 1
          fi

          yes | sdkmanager --licenses

          sdkmanager --install \
            "platform-tools" \
            "cmdline-tools;latest" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Prepare notification resources
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/build/res
          cp -R android_extras/res/. android/build/res/

          chmod +x android/build/gradlew

          test -f android/build/res/drawable-mdpi/ic_notification.png

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import --quit

      - name: Export Debug APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          godot --headless --path . \
            --export-debug "Android" \
            build/SpotRush-debug.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          test -s build/SpotRush-debug.apk

          echo "APK generated successfully:"
          ls -lh build/SpotRush-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotRush-Android-APK
          path: build/SpotRush-debug.apk
          if-no-files-found: error
          retention-days: 14