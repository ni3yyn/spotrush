
name: Build SpotRush Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotrush-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Install Godot 4.7 Notification Scheduler 6.0
        shell: bash
        run: |
          set -euo pipefail

          archive="/tmp/NotificationSchedulerPlugin-Android-v6.0.zip"
          url="https://github.com/godot-mobile-plugins/godot-notification-scheduler/releases/download/v6.0/NotificationSchedulerPlugin-Android-v6.0.zip"
          expected_sha256="806c85eafe8f4c8aa4ee37e0ed1ab551e85db8755f8aeb1c6302092f809725a3"

          echo "Downloading the Godot 4.7-compatible Android notification plugin..."
          curl --fail --location --retry 3 --retry-delay 2 "$url" --output "$archive"
          echo "$expected_sha256  $archive" | sha256sum --check -

          mkdir -p addons/NotificationSchedulerPlugin/bin/debug
          mkdir -p addons/NotificationSchedulerPlugin/bin/release

          unzip -p "$archive" \
            "res/addons/NotificationSchedulerPlugin/bin/debug/NotificationSchedulerPlugin-debug.aar" \
            > addons/NotificationSchedulerPlugin/bin/debug/NotificationSchedulerPlugin-debug.aar

          unzip -p "$archive" \
            "res/addons/NotificationSchedulerPlugin/bin/release/NotificationSchedulerPlugin-release.aar" \
            > addons/NotificationSchedulerPlugin/bin/release/NotificationSchedulerPlugin-release.aar

          test -s addons/NotificationSchedulerPlugin/bin/debug/NotificationSchedulerPlugin-debug.aar
          test -s addons/NotificationSchedulerPlugin/bin/release/NotificationSchedulerPlugin-release.aar

          echo "Godot Notification Scheduler 6.0 AARs installed and checksum-verified."

      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Checking build environment"
          echo "======================================"

          godot --version
          java -version
          sdkmanager --version

          echo "Checking Godot Android template version..."
          grep -qx "4.7.2.stable" android/.build_version

          echo "Checking Android Gradle project..."
          test -f android/build/build.gradle
          test -f android/build/gradlew
          test -f android/build/gradle/wrapper/gradle-wrapper.properties
          test -f android/build/src/main/AndroidManifest.xml

          echo "Checking notification plugin..."
          test -s addons/NotificationSchedulerPlugin/bin/debug/NotificationSchedulerPlugin-debug.aar
          test -s addons/NotificationSchedulerPlugin/bin/release/NotificationSchedulerPlugin-release.aar
          grep -Fq 'version="6.0"' addons/NotificationSchedulerPlugin/plugin.cfg
          test -f addons/NotificationSchedulerPlugin/model/CustomData.gd
          test -f addons/GMPShared/GmpLogger.gd

          echo "Checking Android export preset..."
          test -f export_presets.cfg
          grep -Fq 'name="Android"' export_presets.cfg
          grep -Fq 'gradle_build/use_gradle_build=true' export_presets.cfg

          echo "All required project files are present."

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Installing Android SDK packages"
          echo "======================================"

          sdkmanager --install \
            "platform-tools" \
            "cmdline-tools;latest" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865"

          echo "Android SDK packages installed."

      - name: Start Android Debug Bridge
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting ADB server..."
          adb start-server
          adb version
          adb devices

          echo "ADB is ready."

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -euo pipefail

          echo "Configuring Godot Android SDK paths..."

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          echo "Godot Android paths configured."

      - name: Exclude development tests from Godot scanning
        shell: bash
        run: |
          set -euo pipefail

          echo "Excluding development test scripts..."

          mkdir -p tests
          touch tests/.gdignore

          echo "Test scripts excluded from Godot project scanning."
          echo "No game tests will be executed."

      - name: Prepare notification resources
        shell: bash
        run: |
          set -euo pipefail

          echo "Preparing Android notification resources..."

          # The v6 exporter reads project assets and copies them into the
          # Android Gradle template during export. Use Android monochrome
          # notification icons with the name expected by v6.
          asset_root="assets/NotificationSchedulerPlugin/android"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$asset_root/drawable-$density"
            cp "android_extras/res/drawable-$density/ic_notification.png" \
              "$asset_root/drawable-$density/ic_default_notification.png"
          done

          chmod +x android/build/gradlew

          test -s "$asset_root/drawable-mdpi/ic_default_notification.png"
          test -s "$asset_root/drawable-xxxhdpi/ic_default_notification.png"

          echo "Notification Scheduler v6 icon resources prepared."

      - name: Export Debug APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          echo "======================================"
          echo "SPOTRUSH ANDROID BUILD"
          echo "======================================"
          echo "Godot: $(godot --version)"
          echo "Java: $JAVA_HOME"
          echo "Android SDK: $ANDROID_HOME"
          echo "Preset: Android"
          echo "Output: build/SpotRush-debug.apk"
          echo "======================================"

          # Make Gradle print tasks instead of using an animated console.
          export GRADLE_OPTS="${GRADLE_OPTS:-} -Dorg.gradle.console=plain -Dorg.gradle.logging.level=info"

          echo ""
          echo "[1/3] Installing Android build template if necessary..."
          echo "[2/3] Importing project and preparing Android resources..."
          echo "[3/3] Building APK with Gradle..."
          echo ""

          timeout 30m godot --headless --verbose --path . \
            --install-android-build-template \
            --export-debug "Android" \
            build/SpotRush-debug.apk

          echo ""
          echo "======================================"
          echo "Godot export command finished."
          echo "======================================"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking generated APK..."

          if [ ! -s build/SpotRush-debug.apk ]; then
            echo "::error::APK was not generated or is empty."
            echo "Build directory contents:"
            find build -maxdepth 2 -type f -ls || true
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh build/SpotRush-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SpotRush-Android-APK
          path: build/SpotRush-debug.apk
          if-no-files-found: error
          retention-days: 14
